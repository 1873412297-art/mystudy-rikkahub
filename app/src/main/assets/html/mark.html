<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'; img-src data: blob: https:; font-src data:; connect-src https:; frame-src data: blob:; child-src data: blob:;">
    <title>Markdown Preview</title>

    {{VENDOR_STYLES}}
    {{VENDOR_LIBS}}
    <script>{{TAVERN_RUNTIME}}</script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: {{ON_BACKGROUND_COLOR}};
            max-width: 100%;
            margin: 0;
            padding: 16px;
            background: {{BACKGROUND_COLOR}};
        }

        /* Responsive design */
        @media (min-width: 768px) {
            body {
                max-width: 800px;
                margin: 0 auto;
                padding: 24px;
            }
        }

        /* Typography */
        h1 { margin-top: 24px; margin-bottom: 16px; font-weight: 600; line-height: 1.25; font-size: 2em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 8px; }
        h2 { margin-top: 20px; margin-bottom: 14px; font-weight: 600; line-height: 1.25; font-size: 1.75em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 8px; }
        h3 { margin-top: 18px; margin-bottom: 12px; font-weight: 600; line-height: 1.25; font-size: 1.5em; }
        h4 { margin-top: 16px; margin-bottom: 10px; font-weight: 600; line-height: 1.25; font-size: 1.25em; }
        h5 { margin-top: 14px; margin-bottom: 8px; font-weight: 600; line-height: 1.25; font-size: 1.1em; }
        h6 { margin-top: 12px; margin-bottom: 6px; font-weight: 600; line-height: 1.25; font-size: 1em; color: {{ON_SURFACE_VARIANT_COLOR}}; }

        p {
            margin-bottom: 16px;
        }

        /* Code styling */
        code {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 3px;
            font-size: 85%;
            margin: 0;
            padding: 0.2em 0.4em;
            font-family: 'SF Mono', Monaco, Inconsolata, 'Roboto Mono', monospace;
        }

        pre {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 6px;
            font-size: 85%;
            line-height: 1.45;
            overflow: auto;
            padding: 16px;
            margin-bottom: 16px;
        }

        pre code {
            background: transparent;
            border: 0;
            display: inline;
            line-height: inherit;
            margin: 0;
            overflow: visible;
            padding: 0;
            word-wrap: normal;
        }

        /* Tables */
        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            margin-bottom: 16px;
        }

        table th, table td {
            border: 1px solid {{OUTLINE_VARIANT_COLOR}};
            padding: 6px 13px;
        }

        table th {
            background: {{SURFACE_VARIANT_COLOR}};
            font-weight: 600;
        }

        table tr:nth-child(2n) {
            background: {{SURFACE_VARIANT_COLOR}};
        }

        /* Lists */
        ul, ol {
            margin-bottom: 16px;
            padding-left: 2em;
        }

        li {
            margin-bottom: 4px;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid {{OUTLINE_VARIANT_COLOR}};
            color: {{ON_SURFACE_VARIANT_COLOR}};
            margin: 0 0 16px 0;
            padding: 0 16px;
        }

        /* Links */
        a {
            color: {{PRIMARY_COLOR}};
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Images */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 8px 0;
        }

        /* Horizontal rules */
        hr {
            background: {{OUTLINE_VARIANT_COLOR}};
            border: 0;
            height: 1px;
            margin: 24px 0;
        }

        /* KaTeX math */
        .katex {
            font-size: 1.1em;
        }

        .katex-display {
            margin: 16px 0;
            overflow-x: auto;
        }

        /* Mermaid diagrams */
        .mermaid {
            text-align: center;
            margin: 16px 0;
        }

        /* Task lists */
        .task-list-item {
            list-style-type: none;
        }

        .task-list-item input[type="checkbox"] {
            margin-right: 8px;
        }

        /* HTML iframe container */
        .html-iframe-container {
            width: 100%;
            border: 1px solid {{OUTLINE_VARIANT_COLOR}};
            border-radius: 8px;
            overflow: hidden;
            background: {{SURFACE_COLOR}};
        }

        .html-iframe-container iframe {
            width: 100%;
            min-height: 400px;
            border: none;
            display: block;
        }

        .html-badge {
            display: inline-block;
            padding: 2px 8px;
            background: {{PRIMARY_COLOR}};
            color: {{BACKGROUND_COLOR}};
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* SillyTavern macro highlighting */
        .tavern-macro {
            display: inline-block; padding: 1px 7px; border-radius: 4px;
            background: {{PRIMARY_COLOR}}22; color: {{PRIMARY_COLOR}};
            font-family: 'SF Mono', Monaco, 'Roboto Mono', monospace;
            font-size: 0.88em; font-weight: 500; white-space: nowrap;
            border: 1px solid {{PRIMARY_COLOR}}44;
        }
        .tavern-action { font-style: italic; opacity: 0.85; }

        /* Theme colors are dynamically replaced by the Android app */
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        (function () {
        // All renderers are bundled into this document by Android. No file/network asset lookup occurs at runtime.
        const vscodeKatex = window.vscodeKatex;
        const MarkdownItTaskLists = window.MarkdownItTaskLists;
        const katex = window.katex;
        const hljs = window.hljs;
        const mermaid = window.mermaid;
        const DOMPurify = window.DOMPurify;

        function reportDocumentReady() {
            try {
                if (window.RikkahubBridge && window.RikkahubBridge.documentReady) {
                    window.RikkahubBridge.documentReady();
                }
            } catch (_) {}
        }

        function decodeBase64Utf8(value) {
            const binary = window.atob(value);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
            let encoded = '';
            for (let i = 0; i < bytes.length; i++) encoded += '%' + bytes[i].toString(16).padStart(2, '0');
            return decodeURIComponent(encoded);
        }

        // Configure markdown-it
        const md = new MarkdownIt({
            html: true,         // 允许 raw HTML，但渲染后会用 DOMPurify 净化（见 render() 末尾）
            xhtmlOut: false,    // Use '/' to close single tags (<br />)
            breaks: true,       // Convert '\n' in paragraphs into <br> (matching ST behavior)
            langPrefix: 'language-',  // CSS language prefix for fenced blocks
            linkify: true,      // Autoconvert URL-like text to links
            typographer: true,  // Enable some language-neutral replacement + quotes beautification
            quotes: '“”‘’',     // Quote chars
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="hljs"><code>' +
                               hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                               '</code></pre>';
                    } catch (__) {}
                }
                return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
            }
        });

        // Add plugins
        // 传入已加载 mhchem 扩展的 katex 实例, 否则插件会使用其内部自带的另一个 katex 实例,
        // 导致 \ce 等 mhchem 语法无法识别 (Undefined control sequence: \ce)
        md.use(vscodeKatex, { katex: katex });

        md.use(MarkdownItTaskLists, {
            enabled: true,
            label: true,
            labelAfter: true
        });

        // Add custom renderer for mermaid
        const defaultFenceRenderer = md.renderer.rules.fence || function(tokens, idx, options, env, renderer) {
            return renderer.renderToken(tokens, idx, options);
        };

        md.renderer.rules.fence = function(tokens, idx, options, env, renderer) {
            const token = tokens[idx];
            const info = token.info ? md.utils.unescapeAll(token.info).trim() : '';

            if (info === 'mermaid') {
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                return `<div class="mermaid" id="${id}">${token.content.trim()}</div>\n`;
            }

            return defaultFenceRenderer(tokens, idx, options, env, renderer);
        };

        // Configure mermaid
        // securityLevel: 'strict' 阻止图表内的 click events 与 HTML 注入（防 mermaid 历史 XSS）。
        mermaid.initialize({
            startOnLoad: false,
            theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
            securityLevel: 'strict',
            fontFamily: 'inherit'
        });

        // The markdown content to render (base64 encoded)
        const markdownBase64 = `{{MARKDOWN_BASE64}}`;
        let markdownContent = decodeBase64Utf8(markdownBase64);

        // 安全：HTML 自动检测 + iframe 渲染路径已禁用。
        // 旧实现使用 sandbox="allow-scripts allow-same-origin" 是 W3C 警告的危险组合
        // （iframe 内 JS 可移除自身 sandbox 后 reload 父页绕过隔离）。
        // 现在 LLM 输出的所有 HTML 标签将被 markdown-it (html:false) 转义为文本。
        function detectHtmlContent(content) {
            return { isHtml: false, htmlContent: null };
        }

        /**
         * Build HTML preview with theme-matched styling for iframe rendering
         */
        function buildHtmlViewerContent(htmlContent) {
            const bgColor = '{{BACKGROUND_COLOR}}';
            const textColor = '{{ON_BACKGROUND_COLOR}}';
            const primaryColor = '{{PRIMARY_COLOR}}';

            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data:;">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: ${textColor};
            margin: 0;
            padding: 16px;
            background: ${bgColor};
        }
        a { color: ${primaryColor}; text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; height: auto; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid ${textColor}33; padding: 8px; }
        pre { overflow-x: auto; padding: 12px; background: ${textColor}11; border-radius: 6px; }
        code { font-family: 'SF Mono', Monaco, Inconsolata, 'Roboto Mono', monospace; background: ${textColor}11; padding: 2px 6px; border-radius: 3px; }

        /* SillyTavern 角色卡常用的 <status!> 状态栏（自创非标准标签）。
           我们在预处理阶段把它转成 <div class="status-block">，再在这里给样式。 */
        .status-block {
            display: block;
            margin: 12px 0;
            padding: 12px 14px;
            background: ${primaryColor}1A;
            border-left: 3px solid ${primaryColor};
            border-radius: 6px;
            font-size: 0.95em;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status-block .status-label {
            font-weight: 600;
            color: ${primaryColor};
            margin-right: 4px;
        }
        .json-patch-block {
            border-left-color: #ff9800;
            background: #ff98001a;
        }
        .json-patch-op {
            display: inline-block;
            min-width: 4.5em;
            font-weight: 700;
            color: ${primaryColor};
        }
        .json-patch-path {
            font-family: 'SF Mono', Monaco, 'Roboto Mono', monospace;
            font-weight: 600;
        }
    </style>
</head>
<body>
${htmlContent}
</body>
</html>`;
        }

        /**
         * Render HTML content in a sandboxed iframe
         */
        function renderHtmlContent(htmlContent) {
            const container = document.getElementById('content');
            const safeHtml = buildHtmlViewerContent(htmlContent);
            const encodedHtml = btoa(unescape(encodeURIComponent(safeHtml)));

            container.innerHTML = `
                <div class="html-badge">HTML</div>
                <div class="html-iframe-container">
                    <iframe
                        src="data:text/html;base64,${encodedHtml}"
                        sandbox="allow-scripts allow-same-origin"
                        title="HTML Preview"
                        onload="this.style.height = (this.contentDocument.body.scrollHeight + 32) + 'px'"
                    ></iframe>
                </div>
            `;
        }

        let hasJsonPatchBlock = false;

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function findMatchingBracket(text, startIndex) {
            const openChar = text[startIndex];
            const closeChar = openChar === '[' ? ']' : openChar === '{' ? '}' : null;
            if (!closeChar) return startIndex;

            let depth = 0;
            let inString = false;
            let escaped = false;

            for (let i = startIndex; i < text.length; i++) {
                const c = text[i];
                if (escaped) {
                    escaped = false;
                    continue;
                }
                if (c === '\\') {
                    escaped = true;
                    continue;
                }
                if (c === '"') {
                    inString = !inString;
                    continue;
                }
                if (!inString) {
                    if (c === openChar) {
                        depth++;
                    } else if (c === closeChar) {
                        depth--;
                        if (depth === 0) return i + 1;
                    }
                }
            }

            return startIndex;
        }

        function isJsonPatchArray(candidate) {
            try {
                const parsed = JSON.parse(candidate);
                return Array.isArray(parsed) && parsed.length > 0 && parsed.every(op =>
                    op && typeof op === 'object' &&
                    typeof op.op === 'string' &&
                    typeof op.path === 'string'
                );
            } catch {
                return false;
            }
        }

        function summarizeJsonPatch(candidate) {
            const ops = JSON.parse(candidate);
            return ops.map(op => {
                const value = Object.prototype.hasOwnProperty.call(op, 'value')
                    ? ` = ${escapeHtml(typeof op.value === 'string' ? op.value : JSON.stringify(op.value))}`
                    : '';
                return `<div><span class="json-patch-op">${escapeHtml(op.op)}</span> <span class="json-patch-path">${escapeHtml(op.path)}</span>${value}</div>`;
            }).join('');
        }

        function transformJsonPatchBlocks(content) {
            let out = '';
            let i = 0;

            while (i < content.length) {
                if (content[i] === '[') {
                    const end = findMatchingBracket(content, i);
                    if (end > i) {
                        const candidate = content.slice(i, end);
                        if (isJsonPatchArray(candidate)) {
                            hasJsonPatchBlock = true;
                            out += `\n\n<div class="status-block json-patch-block">${summarizeJsonPatch(candidate)}</div>\n\n`;
                            i = end;
                            continue;
                        }
                    }
                }

                out += content[i];
                i++;
            }

            return out;
        }

        // Convert \[ ... \] to $$ ... $$ for LaTeX block math
        markdownContent = markdownContent.replace(/\\\[([\s\S]*?)\\\]/g, (match, content) => {
            return '\n$$\n' + content.trim() + '\n$$\n';
        });
        // Convert \( ... \) to $ ... $ for LaTeX inline math
        markdownContent = markdownContent.replace(/\\\(([\s\S]*?)\\\)/g, '$$$1$$');

        // SillyTavern status blocks use non-standard tags such as <status!>.
        // Normalize them into styled HTML blocks before markdown rendering.
        markdownContent = markdownContent.replace(
            /<(status!?|status_block)>([\s\S]*?)(?:<\/\1>|$)/gi,
            (match, tagName, inner) => {
                const lines = inner.split('\n').map(line => {
                    const m = line.match(/^(\s*)([\u4e00-\u9fa5A-Za-z0-9_]{1,10})([:：])\s*(.*)$/);
                    if (m) {
                        const [, lead, label, sep, content] = m;
                        return `${lead}<span class="status-label">${label}${sep}</span>${content}`;
                    }
                    return line;
                });
                return `\n\n<div class="status-block">${lines.join('\n')}</div>\n\n`;
            }
        );
        // Bare JSON Patch arrays are also rendered as compact status blocks.
        markdownContent = transformJsonPatchBlocks(markdownContent);

        // Detect if content is HTML
        const detection = hasJsonPatchBlock ? { isHtml: false, htmlContent: null } : detectHtmlContent(markdownContent);

        if (detection.isHtml) {
            // Render as HTML directly
            renderHtmlContent(detection.htmlContent);
            reportDocumentReady();
        } else {
            // Render markdown with markdown-it
            async function renderMarkdown() {
                try {
                    // Process with markdown-it (html:true)
                    const rawHtml = md.render(markdownContent);

                    // 用 DOMPurify 白名单净化，关键拦截：
                    // - <script> / <iframe> / <object> / <embed> / on* 事件 / javascript: 协议
                    // - <a target=_blank> 强制 rel=noopener noreferrer
                    // 允许常用标签：details/summary/font/sub/sup/kbd/mark/u/s/del/ins/abbr/cite 等
                    const cleanHtml = DOMPurify.sanitize(rawHtml, {
                        USE_PROFILES: { html: true, svg: false, mathMl: false },
                        ADD_TAGS: ['details', 'summary', 'font', 'mark', 'kbd'],
                        ADD_ATTR: ['open', 'color', 'face', 'size', 'target', 'class'],
                        FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'frame', 'frameset', 'noframes', 'meta', 'base', 'link', 'form', 'input', 'button', 'textarea', 'select', 'option'],
                        FORBID_ATTR: ['onerror', 'onload', 'onclick', 'onmouseover', 'onmouseout', 'onfocus', 'onblur', 'onchange', 'onsubmit', 'formaction', 'srcdoc'],
                        ALLOW_DATA_ATTR: false,
                        ALLOW_UNKNOWN_PROTOCOLS: false,
                    });
                    document.getElementById('content').innerHTML = cleanHtml;

                    // Render mermaid diagrams
                    const mermaidElements = document.querySelectorAll('.mermaid');
                    if (mermaidElements.length > 0) {
                        await mermaid.run({
                            nodes: mermaidElements
                        });
                    }

                    // Render KaTeX math
                    document.querySelectorAll('.math.inline').forEach(el => {
                        try {
                            katex.render(el.textContent, el, {
                                throwOnError: false,
                                errorColor: '#cc0000'
                            });
                        } catch (e) {
                            console.warn('KaTeX inline render error:', e);
                        }
                    });

                    document.querySelectorAll('.math.block').forEach(el => {
                        try {
                            katex.render(el.textContent, el, {
                                displayMode: true,
                                throwOnError: false,
                                errorColor: '#cc0000'
                            });
                        } catch (e) {
                            console.warn('KaTeX block render error:', e);
                        }
                    });

                    // Handle external links
                    document.querySelectorAll('a[href^="http"]').forEach(link => {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    });
                } catch (error) {
                    console.error('Error rendering markdown:', error);
                    document.getElementById('content').textContent = 'Error rendering markdown content: ' + error.message;
                } finally {
                    reportDocumentReady();
                }
            }

            // Call the render function
            renderMarkdown();
        }
        })();
    </script>
</body>
</html>
