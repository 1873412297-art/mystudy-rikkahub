<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'; connect-src http: https:; img-src data: blob: http: https:; media-src data: blob: http: https:; font-src data:; frame-src data: blob:; child-src data: blob:;">
  {{VENDOR_STYLES}}
  {{VENDOR_LIBS}}
  <style>
    :root {
      color-scheme: light dark;
      --rikkahub-bg: transparent;
      --rikkahub-surface: rgba(127, 127, 127, .08);
      --rikkahub-surface-variant: rgba(80, 120, 255, .10);
      --rikkahub-text: inherit;
      --rikkahub-text-secondary: inherit;
      --rikkahub-border: rgba(127, 127, 127, .25);
      --rikkahub-accent: #4a90d9;
    }
    html, body { margin: 0; padding: 0; background: var(--rikkahub-bg); color: var(--rikkahub-text); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #chat[data-card-css-scope] { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
    .mes { position: relative; display: flex; flex-direction: column; border-radius: 12px; padding: 10px 12px; }
    .mes.user { background: var(--rikkahub-surface-variant); }
    .mes.assistant, .mes.system, .mes.tool { background: var(--rikkahub-surface); }
    .mes_block { display: flex; flex-direction: column; min-width: 0; }
    .name_text { display: flex; align-items: center; min-height: 20px; margin-bottom: 4px; }
    .name_text .ch_name { color: var(--rikkahub-text-secondary); font-size: 13px; font-weight: 600; opacity: .82; }
    .mes_text { display: flex; flex-direction: column; gap: 6px; min-width: 0; line-height: 1.55; overflow-wrap: anywhere; }
    .mes_text > * { max-width: 100%; }
    .mes_text p { margin: 0 0 8px; }
    .mes_text p:last-child { margin-bottom: 0; }
    .mes_text pre { overflow: auto; border-radius: 8px; padding: 10px 12px; background: rgba(20, 20, 20, .75); }
    .mes_text img { max-width: 100%; height: auto; }
    .mes_text a { color: var(--rikkahub-accent); }
    .html-part { position: relative; min-height: 120px; max-height: 100vh; overflow: hidden; border-radius: 8px; }
    .html-part iframe { display: block; width: 100%; min-height: 120px; max-height: 100vh; border: 0; background: transparent; }
    .html-fullscreen { position: absolute; top: 6px; right: 6px; z-index: 2; }
    .message-actions { display: none; }
    .branch-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; }
    .branch-actions:empty { display: none; }
    .branch-actions button { border: 0; border-radius: 999px; padding: 3px 9px; color: var(--rikkahub-text-secondary); background: transparent; }
  </style>
</head>
<body>
  <main id="chat" data-card-css-scope="tavern-conversation"></main>
  <template id="raw-html-part-template">
    <section class="html-part" data-render-mode="html">
      <iframe data-html-frame sandbox="allow-scripts"></iframe>
      <button type="button" class="html-fullscreen" data-message-action="open-html" data-fullscreen-target="">&#x26F6;</button>
    </section>
  </template>
  <script>
    window.__RIKKAHUB_TAVERN_CONVERSATION__ = {{INITIAL_SNAPSHOT}};
    (function () {
      'use strict';
      var root = document.getElementById('chat');
      var rawHtmlTemplate = document.getElementById('raw-html-part-template');
      var state = window.__RIKKAHUB_TAVERN_CONVERSATION__;
      var markdown = null;
      var appliedThemeVariables = [];

      function configureMarkdown() {
        if (!window.MarkdownIt || !window.DOMPurify) return null;
        markdown = new window.MarkdownIt({
          html: true,
          breaks: true,
          linkify: true,
          highlight: function (source, language) {
            if (window.hljs && language && window.hljs.getLanguage(language)) {
              try {
                return '<pre class="hljs"><code>' +
                  window.hljs.highlight(source, { language: language, ignoreIllegals: true }).value +
                  '</code></pre>';
              } catch (_) {}
            }
            var fallback = document.createElement('div');
            fallback.textContent = source;
            return '<pre class="hljs"><code>' + fallback.innerHTML + '</code></pre>';
          }
        });
        if (window.MarkdownItTaskLists) {
          markdown.use(window.MarkdownItTaskLists, { enabled: true, label: true, labelAfter: true });
        }
        if (window.katex && window.vscodeKatex) {
          try { markdown.use(window.vscodeKatex, { katex: window.katex }); } catch (_) {}
        }
        var defaultFenceRenderer = markdown.renderer.rules.fence || function (tokens, index, options, env, self) {
          return self.renderToken(tokens, index, options);
        };
        markdown.renderer.rules.fence = function (tokens, index, options, env, self) {
          var token = tokens[index];
          var info = token.info ? markdown.utils.unescapeAll(token.info).trim() : '';
          if (info === 'mermaid') {
            return '<div class="mermaid">' + token.content.trim() + '</div>';
          }
          return defaultFenceRenderer(tokens, index, options, env, self);
        };
        return markdown;
      }

      function initializeMermaid() {
        if (!window.mermaid) return;
        try {
          window.mermaid.initialize({
            startOnLoad: false,
            theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'default',
            securityLevel: 'strict',
            fontFamily: 'inherit'
          });
        } catch (_) {}
      }

      function runMarkdownEnhancements(scope) {
        if (!window.mermaid || !scope) return;
        var mermaidNodes = scope.querySelectorAll('.mermaid:not([data-processed])');
        if (mermaidNodes.length === 0) return;
        try {
          var pending = window.mermaid.run({ nodes: mermaidNodes });
          if (pending && typeof pending.catch === 'function') pending.catch(function () {});
        } catch (_) {}
      }

      function applyDocumentStyle(snapshot) {
        var nextThemeVariables = Object.keys(snapshot.themeCssVariables || {}).filter(function (name) {
          return name.indexOf('--') === 0;
        }).sort();
        appliedThemeVariables.forEach(function (name) {
          if (nextThemeVariables.indexOf(name) < 0) document.documentElement.style.removeProperty(name);
        });
        nextThemeVariables.forEach(function (name) {
          document.documentElement.style.setProperty(name, snapshot.themeCssVariables[name]);
        });
        appliedThemeVariables = nextThemeVariables;
        var cardStyle = document.getElementById('rikkahub-card-css');
        if (!cardStyle) {
          cardStyle = document.createElement('style');
          cardStyle.id = 'rikkahub-card-css';
          document.head.appendChild(cardStyle);
        }
        cardStyle.textContent = snapshot.cardCss || '';
        document.documentElement.dataset.streaming = String(!!snapshot.streaming);
      }

      function renderMarkdownPart(part) {
        var fallback = document.createElement('div');
        fallback.dataset.renderMode = 'markdown';
        fallback.textContent = part.text;
        if (!markdown || !window.DOMPurify) return fallback;
        var rendered = markdown.render(part.text);
        fallback.innerHTML = window.DOMPurify.sanitize(rendered, {
          USE_PROFILES: { html: true, svg: false, mathMl: false },
          ADD_TAGS: ['details', 'summary', 'font', 'mark', 'kbd'],
          ADD_ATTR: ['open', 'color', 'face', 'size', 'target', 'class'],
          FORBID_TAGS: ['style', 'script', 'iframe', 'object', 'embed', 'frame', 'frameset', 'meta', 'base', 'link', 'form'],
          FORBID_ATTR: ['style', 'srcdoc', 'formaction', 'onerror', 'onload', 'onclick', 'onmouseover', 'onmouseout', 'onfocus', 'onblur', 'onchange', 'onsubmit'],
          ALLOW_DATA_ATTR: false,
          ALLOW_UNKNOWN_PROTOCOLS: false
        });
        return fallback;
      }

      function injectIframeRuntime(rawHtml, messageId, frameTarget) {
        var runtime = window.__RIKKAHUB_RUNTIME_SOURCE__ || '';
        if (!runtime) return rawHtml;
        var helper = runtime + "\n" +
          "window.addEventListener('message',function(e){var d=e.data||{};" +
          "if(d.__rikkahubEvent){document.dispatchEvent(new CustomEvent(d.__rikkahubEvent,{detail:d.detail,bubbles:true}));}});" +
          "document.addEventListener('contextmenu',function(e){e.preventDefault();" +
          "try{window.TavernConversationBridge.longPress(" + JSON.stringify(messageId) + ");}catch(_){}});" +
          "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;" +
          "if(a){e.preventDefault();try{window.TavernConversationBridge.openLink(a.href||a.getAttribute('href')||'');}catch(_){}}},true);" +
          "try{window.open=function(u){try{window.TavernConversationBridge.openLink(String(u||''));}catch(_){}return null;};}catch(_){}" +
          "function __rhSize(){try{var h=Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0);" +
          "parent.postMessage({__rikkahubFrameHeight:h,frameTarget:" + JSON.stringify(frameTarget) + "},'*');}catch(_){}}" +
          "if(typeof ResizeObserver!=='undefined'){try{new ResizeObserver(__rhSize).observe(document.documentElement);}catch(_){}}" +
          "addEventListener('load',__rhSize);setTimeout(__rhSize,50);setTimeout(__rhSize,400);" +
          "try{window.TavernConversationBridge.ready();}catch(_){};";
        return rawHtml + '<script>' + helper.replace(/<\/script/gi, '<\\/script') + '<\/script>';
      }

      function renderHtmlPart(part, node, message, partIndex) {
        var fragment = rawHtmlTemplate.content.cloneNode(true);
        var section = fragment.querySelector('[data-render-mode="html"]');
        var iframe = fragment.querySelector('[data-html-frame]');
        var fullscreen = fragment.querySelector('[data-fullscreen-target]');
        var target = message.id + ':' + partIndex;
        section.dataset.messageId = message.id;
        iframe.dataset.messageId = message.id;
        iframe.dataset.fullscreenTarget = target;
        iframe.srcdoc = injectIframeRuntime(part.text, message.id, target);
        iframe.addEventListener('load', function () {
          try { window.TavernConversationBridge.ready(); } catch (_) {}
        });
        fullscreen.dataset.nodeId = node.id;
        fullscreen.dataset.messageId = message.id;
        fullscreen.dataset.fullscreenTarget = target;
        return fragment;
      }

      function renderNode(node, nodeIndex) {
        var message = node.selectedMessage;
        if (!message) return null;
        var mes = document.createElement('article');
        mes.className = 'mes ' + String(message.role || 'assistant').toLowerCase();
        mes.dataset.nodeId = node.id;
        mes.dataset.messageId = message.id;
        mes.dataset.branchIndex = String(node.selectedIndex);
        mes.dataset.streaming = String(!!state.streaming && nodeIndex === state.nodes.length - 1);

        var block = document.createElement('div');
        block.className = 'mes_block';
        var nameText = document.createElement('div');
        nameText.className = 'name_text';
        var name = document.createElement('span');
        name.className = 'name ch_name';
        name.textContent = message.name || '';
        nameText.appendChild(name);
        block.appendChild(nameText);

        var text = document.createElement('div');
        text.className = 'mes_text';
        message.parts.forEach(function (part, partIndex) {
          text.appendChild(part.renderMode === 'html'
            ? renderHtmlPart(part, node, message, partIndex)
            : renderMarkdownPart(part));
        });
        block.appendChild(text);

        var actions = document.createElement('button');
        actions.type = 'button';
        actions.className = 'message-actions';
        actions.setAttribute('data-message-action', 'long-press');
        actions.setAttribute('data-node-id', node.id);
        actions.setAttribute('data-message-id', message.id);
        block.appendChild(actions);

        var branches = document.createElement('div');
        branches.className = 'branch-actions';
        for (var branchIndex = 0; branchIndex < node.branchCount; branchIndex += 1) {
          var button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('data-message-action', 'select-branch');
          button.setAttribute('data-node-id', node.id);
          button.setAttribute('data-message-id', message.id);
          button.setAttribute('data-branch-index', String(branchIndex));
          button.textContent = String(branchIndex + 1);
          if (branchIndex === node.selectedIndex) button.setAttribute('aria-current', 'true');
          branches.appendChild(button);
        }
        block.appendChild(branches);
        mes.appendChild(block);
        return mes;
      }

      function renderAll() {
        applyDocumentStyle(state);
        root.replaceChildren();
        state.nodes.forEach(function (node, index) {
          var element = renderNode(node, index);
          if (element) root.appendChild(element);
        });
        runMarkdownEnhancements(root);
      }

      function rerenderNode(nodeId) {
        var index = state.nodes.findIndex(function (node) { return node.id === nodeId; });
        var existing = root.querySelector('[data-node-id="' + CSS.escape(nodeId) + '"]');
        if (index < 0) {
          if (existing) existing.remove();
          return;
        }
        var replacement = renderNode(state.nodes[index], index);
        if (!replacement) {
          if (existing) existing.remove();
        } else if (existing) {
          existing.replaceWith(replacement);
        } else {
          root.insertBefore(replacement, root.children[index] || null);
        }
        runMarkdownEnhancements(replacement);
      }

      function applyPatch(patch) {
        if (patch.type === 'replace_all') {
          state = patch.snapshot;
          renderAll();
          return;
        }
        if (patch.type === 'remove_message') {
          state.nodes = state.nodes.filter(function (node) { return node.id !== patch.nodeId; });
          rerenderNode(patch.nodeId);
          return;
        }
        if (patch.type === 'upsert_message') {
          var upsertNode = state.nodes.find(function (node) { return node.id === patch.nodeId; });
          if (!upsertNode) {
            upsertNode = { id: patch.nodeId, selectedIndex: 0, branchCount: 1, selectedMessage: patch.message };
            state.nodes.splice(patch.nodeIndex, 0, upsertNode);
          }
          upsertNode.selectedMessage = patch.message;
          rerenderNode(patch.nodeId);
          return;
        }
        if (patch.type === 'select_branch') {
          var selectNode = state.nodes.find(function (node) { return node.id === patch.nodeId; });
          if (!selectNode || selectNode.selectedMessage.id !== patch.messageId) return;
          selectNode.selectedIndex = patch.selectedIndex;
          selectNode.branchCount = patch.branchCount;
          rerenderNode(patch.nodeId);
          return;
        }
        if (patch.type === 'set_streaming') {
          state.streaming = !!patch.streaming;
          renderAll();
        }
      }

      window.RikkahubConversationDocument = {
        applyPatches: function (patchJson) {
          var patches = typeof patchJson === 'string' ? JSON.parse(patchJson) : patchJson;
          (patches || []).forEach(applyPatch);
        },
        snapshot: function () { return state; }
      };

      function nativeBridge() {
        return window.TavernConversationBridge || null;
      }

      root.addEventListener('click', function (event) {
        var action = event.target.closest('[data-message-action]');
        var bridge = nativeBridge();
        if (action && bridge) {
          event.preventDefault();
          var kind = action.getAttribute('data-message-action');
          if (kind === 'select-branch') {
            window.TavernConversationBridge.selectBranch(action.dataset.nodeId || '', Number(action.dataset.branchIndex));
          } else if (kind === 'open-html') {
            window.TavernConversationBridge.openHtml(action.dataset.messageId || '');
          } else if (kind === 'long-press') {
            window.TavernConversationBridge.longPress(action.dataset.messageId || '');
          }
          return;
        }
        var anchor = event.target.closest('a[href]');
        if (anchor) {
          event.preventDefault();
          if (bridge) window.TavernConversationBridge.openLink(anchor.href || anchor.getAttribute('href') || '');
        }
      });

      root.addEventListener('contextmenu', function (event) {
        var message = event.target.closest('.mes[data-message-id]');
        var bridge = nativeBridge();
        if (!message || !bridge) return;
        event.preventDefault();
        window.TavernConversationBridge.longPress(message.dataset.messageId || '');
      });

      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (!data.__rikkahubFrameHeight || !data.frameTarget) return;
        var frame = root.querySelector('iframe[data-fullscreen-target="' + CSS.escape(String(data.frameTarget)) + '"]');
        if (!frame || event.source !== frame.contentWindow) return;
        var height = Math.max(120, Math.min(Number(data.__rikkahubFrameHeight) || 120, window.innerHeight || 800));
        frame.style.height = height + 'px';
      });

      markdown = configureMarkdown();
      initializeMermaid();
      renderAll();
      if (window.TavernConversationBridge) window.TavernConversationBridge.ready();
    })();
  </script>
</body>
</html>
