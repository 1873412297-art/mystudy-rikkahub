      function renderMediaPart(part, tagName) {

      function renderDocumentPart(part) {

        summary.textContent = part.finished === false ? 'Reasoning…' : 'Reasoning';

      function renderPart(part, node, message, partIndex) {
        if (part.partType === 'text') return part.renderMode === 'html'
          ? renderHtmlPart(part, node, message, partIndex)
          : renderMarkdownPart(part);

        if (part.partType === 'audio') return renderMediaPart(part, 'audio');

        if (part.partType === 'reasoning') return renderReasoningPart(part);
        if (part.partType === 'tool') return renderToolPart(part, node, message, partIndex);

        unsupported.textContent = 'Unsupported message part';
        return unsupported;

        runMarkdownEnhancements(replacement);

          return;
        }
        if (patch.type === 'upsert_message') {
          var upsertNode = state.nodes.find(function (node) { return node.id === patch.nodeId; });
          if (!upsertNode) {
            upsertNode = { id: patch.nodeId, selectedIndex: 0, branchCount: 1, selectedMessage: patch.message };
            state.nodes.splice(patch.nodeIndex, 0, upsertNode);
          }
          upsertNode.selectedMessage = patch.message;
          rerenderNode(patch.nodeId);
          return;
        }
        if (patch.type === 'select_branch') {
          var selectNode = state.nodes.find(function (node) { return node.id === patch.nodeId; });
          if (!selectNode || selectNode.selectedMessage.id !== patch.messageId) return;
          selectNode.selectedIndex = patch.selectedIndex;
          selectNode.branchCount = patch.branchCount;
          rerenderNode(patch.nodeId);
          return;
        }
        if (patch.type === 'set_streaming') {
          state.streaming = !!patch.streaming;
          renderAll();
        }
      }

      window.RikkahubConversationDocument = {
        applyPatches: function (patchJson) {
          var patches = typeof patchJson === 'string' ? JSON.parse(patchJson) : patchJson;
          (patches || []).forEach(applyPatch);
        },
        triggerOpeningTransition: triggerOpeningTransition,
        snapshot: function () { return state; }
      };

      function nativeBridge() {
        return window.TavernConversationBridge || null;
      }

      root.addEventListener('click', function (event) {
        if (!event.isTrusted) return;
        var action = event.target.closest('[data-message-action]');
        var bridge = nativeBridge();
        if (action && bridge) {
          event.preventDefault();
          var kind = action.getAttribute('data-message-action');
          if (kind === 'select-branch') {
            window.TavernConversationBridge.selectBranch(actionToken, action.dataset.nodeId || '', Number(action.dataset.branchIndex));
          } else if (kind === 'select-greeting') {
            window.TavernConversationBridge.selectGreeting(actionToken, Number(action.dataset.greetingIndex), state.openingSwipe.count, state.revision || 0);
          } else if (kind === 'open-html') {
            window.TavernConversationBridge.openHtml(actionToken, action.dataset.messageId || '');
          } else if (kind === 'long-press') {
            window.TavernConversationBridge.longPress(actionToken, action.dataset.messageId || '');
          } else if (kind === 'tool-approve' || kind === 'tool-reject') {
            window.TavernConversationBridge.toolApproval(
              actionToken,
              action.dataset.toolCallId || '',
              kind === 'tool-approve',
              ''
            );
          } else if (kind === 'tool-answer') {
            var answer = window.prompt('Answer');
            if (answer) window.TavernConversationBridge.toolAnswer(actionToken, action.dataset.toolCallId || '', answer);
          } else if (kind === 'open-resource') {
            window.TavernConversationBridge.openResource(actionToken, action.dataset.resourceUrl || action.src || '', true);
          }
          return;
        }
        var anchor = event.target.closest('a[href]');
        if (anchor) {
          event.preventDefault();
          if (bridge) window.TavernConversationBridge.openLink(actionToken, anchor.href || anchor.getAttribute('href') || '', true);
        }
      });

      root.addEventListener('contextmenu', function (event) {
        if (!event.isTrusted) return;
        var message = event.target.closest('.mes[data-message-id]');
        var bridge = nativeBridge();
        if (!message || !bridge) return;
        event.preventDefault();
        window.TavernConversationBridge.longPress(actionToken, message.dataset.messageId || '');
      });

      var swipeStart = null;
      root.addEventListener('pointerdown', function (event) {
        var message = event.target.closest('.mes');
        if (!event.isTrusted || !message || !state.openingSwipe) return;
        swipeStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
      }, { passive: true });
      root.addEventListener('pointerup', function (event) {
        if (!swipeStart || swipeStart.id !== event.pointerId || !state.openingSwipe) return;
        var dx = event.clientX - swipeStart.x;
        var dy = event.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dy) > Math.abs(dx) || Math.abs(dx) < 52) return;
        var target = state.openingSwipe.index + (dx < 0 ? 1 : -1);
        if (target < 0 || target >= state.openingSwipe.count) return;
        window.TavernConversationBridge.selectGreeting(actionToken, target, state.openingSwipe.count, state.revision || 0);
      }, { passive: true });

      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.__rikkahubRuntimeRequest) {
          dispatchIframeRuntimeRequest(event, data);
          return;
        }
        if (data.__rikkahubFrameHeight === undefined || !data.frameTarget) return;
        var frame = root.querySelector('iframe[data-fullscreen-target="' + CSS.escape(String(data.frameTarget)) + '"]');
        if (!frame || event.source !== frame.contentWindow) return;
        var requestedHeight = Number(data.__rikkahubFrameHeight);
        if (!Number.isFinite(requestedHeight) || requestedHeight <= 0 || requestedHeight > 20000) return;
        var maxHeight = frame.dataset.autoHeight === 'true' ? 5000 : 20000;
        var nextHeight = Math.max(120, Math.min(requestedHeight, maxHeight));
        var previousHeight = Number(frame.__rikkahubPendingHeight || frame.__rikkahubLastValidHeight || 0);
        if (previousHeight > 0 && Math.abs(nextHeight - previousHeight) < 2) return;
        frame.__rikkahubPendingHeight = nextHeight;
        if (frame.__rikkahubHeightTimer) window.clearTimeout(frame.__rikkahubHeightTimer);
        frame.__rikkahubHeightTimer = window.setTimeout(function () {
          frame.__rikkahubHeightTimer = null;
          if (!frame.isConnected || !Number.isFinite(frame.__rikkahubPendingHeight)) return;
          frame.style.height = frame.__rikkahubPendingHeight + 'px';
          frame.__rikkahubLastValidHeight = frame.__rikkahubPendingHeight;
        }, 16);
      });

      showdownConverter = configureShowdown();
      markdown = configureMarkdown();
      initializeMermaid();
      renderAll();
      if (window.TavernConversationBridge) window.TavernConversationBridge.ready(actionToken);
    })();
  </script>
</body>
</html>
